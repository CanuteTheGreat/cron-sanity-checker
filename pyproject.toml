[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cron-sanity-checker"
dynamic = ["version"]
description = "Lint cron schedules: impossible dates, typos, DOM/DOW OR gotcha, DST gaps, plain-English descriptions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Errant Solutions", email = "hello@errant.solutions" }]
keywords = ["cron", "crontab", "schedule", "lint"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://errant.solutions/tools/cron-sanity-checker.html"
Source = "https://git.canutethegreat.com/CanuteTheGreat/cron-sanity-checker"
Changelog = "https://git.canutethegreat.com/CanuteTheGreat/cron-sanity-checker/src/branch/main/CHANGELOG.md"
Releases = "https://git.canutethegreat.com/CanuteTheGreat/cron-sanity-checker/releases"

[project.scripts]
cron-sanity-checker = "cron_sanity_checker:main"

[tool.hatch.version]
path = "cron_sanity_checker.py"

[tool.hatch.build.targets.wheel]
only-include = ["cron_sanity_checker.py"]

[tool.hatch.build.targets.sdist]
only-include = ["cron_sanity_checker.py", "README.md", "LICENSE", "CHANGELOG.md", "tests"]
